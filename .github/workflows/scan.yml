# イメージと依存の、既知の脆弱性を調べる（push・PR のときと、毎週月曜）
name: scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
permissions:
  contents: read
jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: イメージをビルド
        run: docker build -t ani-cal:scan app
      - name: イメージを調べる（OS のパッケージ）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ani-cal:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: 依存クレートを調べる（Cargo.lock）
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
