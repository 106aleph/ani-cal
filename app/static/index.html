<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アニメ配信カレンダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%BA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>アニメ配信カレンダー</h1>
  <nav class="tabs" role="tablist">
    <button data-tab="calendar" class="active">カレンダー</button>
    <button data-tab="catalog">新作一覧</button>
    <button data-tab="tracks">登録作品</button>
  </nav>
  <div class="sync">
    <span id="sync-status" class="muted">-</span>
    <button id="sync-btn" title="しょぼいカレンダーから再取得">今すぐ取得</button>
  </div>
</header>

<main>
  <!-- カレンダー -->
  <section id="tab-calendar" class="tab active">
    <div class="toolbar">
      <div class="seg">
        <button data-view="month" class="active">月</button>
        <button data-view="list">リスト</button>
      </div>
      <div class="nav-month">
        <button id="cal-prev" aria-label="前へ">‹</button>
        <button id="cal-today">今日</button>
        <button id="cal-next" aria-label="次へ">›</button>
        <strong id="cal-label"></strong>
      </div>
      <label class="check"><input type="checkbox" id="opt-late"> 深夜を24時以降表記（5時区切り）</label>
      <label class="check"><input type="checkbox" id="opt-hide-watched"> 視聴済みを隠す</label>
    </div>
    <div id="cal-month"></div>
    <div id="cal-list" hidden></div>
  </section>

  <!-- 新作一覧 -->
  <section id="tab-catalog" class="tab">
    <div class="toolbar">
      <select id="cat-season"></select>
      <select id="cat-platform"><option value="">すべての媒体</option></select>
      <label class="check"><input type="checkbox" id="cat-net"> 配信系の媒体のみ</label>
      <label class="check"><input type="checkbox" id="cat-untracked"> 未登録のみ</label>
      <input type="search" id="cat-q" placeholder="タイトル検索">
    </div>
    <p class="hint">媒体をクリックすると、その媒体の配信日時で登録します（同じ作品を複数の媒体で登録することもできます）。</p>
    <div id="cat-list"></div>
  </section>

  <!-- 登録作品 -->
  <section id="tab-tracks" class="tab">
    <div class="toolbar">
      <button id="track-add-manual" class="primary">＋ 手動で作品を追加</button>
      <a class="btn" href="/calendar.ics" title="Googleカレンダー等で購読できます">ICS</a>
    </div>
    <div id="track-list"></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
