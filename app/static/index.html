<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメ配信カレンダー</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6fde'/%3E%3Ctext x='50' y='73' font-size='68' font-weight='700' font-family='Arial,Helvetica,sans-serif' text-anchor='middle' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#161a21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アニカレ">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <h1>アニメ配信カレンダー</h1>
  <nav class="tabs" role="tablist" aria-label="画面">
    <button data-tab="calendar" class="active">カレンダー</button>
    <button data-tab="catalog">作品一覧</button>
    <button data-tab="tracks">登録作品</button>
    <button data-tab="archive">視聴済み</button>
    <button data-tab="logs">ログ</button>
  </nav>
  <div class="sync">
    <span id="sync-status" class="muted" aria-live="polite">-</span>
    <span class="sync-btns">
      <button id="notify-btn" title="配信開始前の通知を設定">通知</button>
      <button id="sync-cancel-btn" class="danger" disabled title="実行中の取得はありません">中断</button>
      <button id="sync-range-btn" title="期間を指定して取得（放送中の作品や先の予定が出ないとき）">期間指定</button>
      <button id="sync-btn" class="primary" title="しょぼいカレンダーから更新分を取得">今すぐ取得</button>
    </span>
  </div>
</header>

<main>
  <!-- カレンダー -->
  <section id="tab-calendar" class="tab active">
    <div class="toolbar cal-toolbar">
      <div class="nav-month">
        <button id="cal-prev" aria-label="前へ">‹</button>
        <button id="cal-today">今日</button>
        <button id="cal-next" aria-label="次へ">›</button>
        <strong id="cal-label"></strong>
      </div>
      <div class="seg" role="group" aria-label="表示">
        <button data-view="month" class="active">月</button>
        <button data-view="week">週</button>
        <button data-view="list">リスト</button>
      </div>
    </div>
    <div class="toolbar opts">
      <label class="check"><input type="checkbox" id="opt-late"> 深夜を24時以降表記（5時区切り）</label>
      <label class="check"><input type="checkbox" id="opt-hide-watched"> 視聴済みを隠す</label>
    </div>
    <div id="cal-month"></div>
    <div id="cal-week" hidden></div>
    <div id="cal-day" hidden></div>
    <div id="cal-list" hidden></div>
  </section>

  <!-- 作品一覧 -->
  <section id="tab-catalog" class="tab">
    <div class="toolbar">
      <select id="cat-season"></select>
      <select id="cat-platform"><option value="">すべての媒体</option></select>
      <label class="check"><input type="checkbox" id="cat-net"> 配信系の媒体のみ</label>
      <label class="check"><input type="checkbox" id="cat-untracked"> 未登録のみ</label>
      <input type="search" id="cat-q" placeholder="タイトル検索">
    </div>
    <p class="hint">媒体をクリックすると、その媒体の配信日時で登録します（同じ作品を複数の媒体で登録することもできます）。</p>
    <div id="cat-list"></div>
  </section>

  <!-- 登録作品 -->
  <section id="tab-tracks" class="tab">
    <div class="toolbar">
      <button id="track-add-manual" class="primary">＋ 手動で作品を追加</button>
      <span class="spacer"></span>
      <a class="btn" href="/calendar.ics" title="Googleカレンダー等で購読できます">ICS</a>
    </div>
    <div id="track-list" class="track-root" data-archived="0"></div>
  </section>

  <!-- 視聴済み -->
  <section id="tab-archive" class="tab">
    <p class="hint">「登録作品」で全話を視聴済みにして移した作品です。カレンダーや未視聴の一覧には出ません。新しい話が追加されると、自動で登録作品に戻ります。</p>
    <div id="archive-list" class="track-root" data-archived="1"></div>
  </section>

  <!-- ログ -->
  <section id="tab-logs" class="tab">
    <p class="hint">しょぼいカレンダーからの取得履歴です（新しい順・最大500件）。</p>
    <div id="log-coverage" class="coverage"></div>
    <div class="tablewrap"><div id="log-list"></div></div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
