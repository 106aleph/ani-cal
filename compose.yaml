name: anime-calendar

# Tailscale はホスト（VM）側で動かし、
#   sudo tailscale serve --bg ${APP_PORT:-8000}
# で https://<VMのホスト名>.<tailnet>.ts.net/ → 127.0.0.1:8000 に転送する。
# ポートは 127.0.0.1 にのみ公開するので LAN からは直接アクセスできない。

services:
  app:
    build: ./app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /data/anime.db
      # X-Forwarded-For を信用する接続元。ホスト（tailscale serve・cloudflared など）からの接続は、コンテナの中では、Docker の私的なアドレス（既定は 172.16.0.0/12）で届く。
      # Docker のネットワークの範囲を変えているときは、.env の TRUSTED_PROXIES で指定する
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,172.16.0.0/12}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # コンテナの権限を最小限にする（万一アプリが乗っ取られても、できることを減らす）
    read_only: true            # 書き込めるのは /data（DB）と /tmp だけ
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:                   # 起動時に /data の所有者を合わせ、非 root ユーザーに切り替えるためだけに必要
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    # ログが溜まり続けてディスクが埋まらないようにする（10MB × 3ファイルまで。古い行から消える）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
