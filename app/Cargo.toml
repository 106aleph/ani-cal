[package]
name = "ani-cal"
version = "1.0.0"
edition = "2021"
description = "アニメ配信カレンダー（しょぼいカレンダーから配信予定を取得して視聴記録する）"
license = "MIT"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
roxmltree = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
fastrand = "2"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
ctrlc = { version = "3", features = ["termination"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
